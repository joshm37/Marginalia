<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Marginalia</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="mark">M</div>
      <div>
        <h1>Marginalia</h1>
        <p>Save research as you browse</p>
      </div>
      <button id="signout" class="text hidden">Sign out</button>
    </header>
    <main>
      <section id="loading" class="state">Opening your workspace…</section>
      <form id="login" class="hidden">
        <h2>Sign in</h2>
        <p>Use the same account as the Marginalia dashboard.</p>
        <label
          >Email<input
            id="email"
            type="email"
            required
            autocomplete="email" /></label
        ><label
          >Password<input
            id="password"
            type="password"
            required
            autocomplete="current-password" /></label
        ><button type="submit" class="primary">Sign in</button>
      </form>
      <form id="capture" class="hidden">
        <div class="capture-heading">
          <div>
            <h2>Save this source</h2>
            <p>Review the extracted metadata.</p>
          </div>
          <span id="typeBadge">Website</span>
        </div>
        <label>Title<input id="title" required /></label
        ><label
          >Authors · one per line<textarea
            id="authors"
            class="authors"
          ></textarea>
        </label>
        <div class="row">
          <label>Organization<input id="organization" /></label
          ><label>Published<input id="date" type="date" /></label>
        </div>
        <label>URL<input id="url" type="url" required /></label>
        <div class="row">
          <label>DOI<input id="doi" /></label
          ><label
            >Type<select id="type">
              <option>Article</option>
              <option>Report</option>
              <option>Case</option>
              <option>Bill</option>
              <option>Book</option>
              <option>Website</option>
            </select></label
          >
        </div>
        <label
          >Project<select id="project" required>
            <option value="" disabled>Select a project</option>
            <option value="__new__">Create a new project…</option>
          </select></label
        >
        <div id="newProjectRow" class="inline-create hidden">
          <input id="newProjectName" aria-label="New project name" /><button
            id="createProject"
            type="button"
            class="secondary"
          >
            Create
          </button>
        </div>
        <label>Tags</label><div class="tag-editor" id="sourceTagEditor"><div class="tag-control"><input aria-label="Add tag" placeholder="Type a tag and press Enter" /></div><div class="tag-options hidden"></div></div>
        <label>Note<textarea id="notes"></textarea></label
        ><button id="save" type="submit" class="primary">
          Save to Marginalia
        </button>
      </form>
      <section id="success" class="state hidden">
        <div class="success-icon">✓</div>
        <h2>Saved to Marginalia</h2>
        <p>This source is now available in your dashboard.</p>
        <button id="saveAnother" class="secondary">Back to source</button>
      </section>
      <div id="status" role="alert"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
