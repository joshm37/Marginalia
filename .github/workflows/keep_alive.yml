name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 12 * * 1,5"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase database
        run: |
          curl --fail --show-error --silent \
            "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

          echo "Supabase heartbeat successful"
